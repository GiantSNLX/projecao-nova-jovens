<!doctype html>
<html lang="pt-BR" data-type="software">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)" />
    <script>
      // Aplica o tema salvo antes da primeira pintura (sem piscar).
      try {
        var t = localStorage.getItem('projecao-tema');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Portal da equipe Projeção Nova Jovens 2: escalas da mesa, músicas, programação e mídias com simulador de três telas, controle do culto e meditação."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Projeção Nova Jovens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-canvas text-ink antialiased selection:bg-accent/25">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
